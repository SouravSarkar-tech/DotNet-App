name: Push NuGet Packages to GitHub Packages

on:
  push: # Trigger manually when needed

jobs:
  push-packages:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Push NuGet Packages
      run: |
        Write-Host "Pushing NuGet packages to GitHub Packages..."
        Get-ChildItem -Path ./packages -Recurse -Filter *.nupkg | ForEach-Object {
          nuget push $_.FullName -Source https://ghcr.io/souravsarkar-tech/DotNet-App -ApiKey "${{ secrets.PACAKEGE_TOKEN }}"
        }
